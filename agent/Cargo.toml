[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
futures-util = "0.3.34"
qrcode = { version = "0.14.1", default-features = false }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "macros", "io-util", "sync", "time"] }
tokio-tungstenite = "0.30.0"
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

# Linux: uinput, BlueZ and AT-SPI over D-Bus
[target.'cfg(unix)'.dependencies]
evdev = "0.12"
libc = "0.2"
zbus = "5"
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }

# Windows: SendInput, lock lights, random numbers, locking the screen
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.25.1", default-features = false }
# OpenGL as a second way to draw the window, for PCs whose graphics driver has no Vulkan / DX12
eframe = { version = "0.36.2", features = ["glow"] }
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }
cpal = "0.16"
